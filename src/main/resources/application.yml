server:
  port: 8001

spring:
  application:
    name: strider-user-profile
  profiles:
    include: secret
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/strider?currentSchema=user-profile}
    username: ${DB_USERNAME:strider}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    database: postgresql
    hibernate:
        ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}   # 로컬은 localhost:9092 로 override
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  redis:
    host: ${REDIS_HOST:localhost}
    port: 6379
  data:
    redis:
      repositories:
        enabled: false
  mvc:
    static-path-pattern: /static/**
  web:
    resources:
      static-locations: file:uploads/

app:
  upload:
    dir: ./uploads
  base-url: https://www.strider.r-e.kr

provider:
  kakao:
    user-info-uri: https://kapi.kakao.com/v2/user/me
  naver:
    user-info-uri: https://openapi.naver.com/v1/nid/me
  apple:
    jwks-uri: https://appleid.apple.com/auth/keys
    issuer: https://appleid.apple.com
    client-id: com.strider.service # Apple Service ID or Bundle ID

logging:
  level:
    root: INFO
    com.strider: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

services:
  gateway:
    base-url: http://strider-gateway:8000